<!DOCTYPE html>
<html lang="en-GB" data-view="{%  block data_view %}{{ DATA.get("data_view", "") }}{%  endblock %}">
    <head>
        <meta charset="UTF-8">
        <meta name="theme-color" content="#6B00E9">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Portfolio of Aga Jerzewska">
        <title>{{ DATA.get("page_title") }}</title>
        {{ ES6CSS.headers() | safe }}
        <link href="https://fonts.googleapis.com/css?family=Work+Sans" rel="stylesheet" />
        <link href="/resources/css/print.css"  rel="stylesheet" media="print" />

        {% block head %}
        {% endblock %}

        {% block head_extra %}
        {% endblock %}
    </head>
    <body>
        <div id="main-wrapper">
            <div id="inner-wrapper">
                {% block body %}{% endblock %}
            </div>
            {% include "snippets/footer.html" %}
        </div>
    </body>
</html>
