{
  "sites": [
    {
      "root": ".",
      "plugins": [
        "jerzewska",
        "es6css"
      ],
      "jerzewska": {
        "debug": false
      },
      "es6css": {
        "CSS": [
          "/resources/css/styles.css"
        ],
        "CDN": [
          {"alias": "underscore", "src": "https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.13.6/underscore-esm.min.js"},
          {"alias": "jquery", "src": "https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"},
          {"alias": "jquery-ui", "src": "https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"},
          {"alias": "malicacid", "src": "/resources/javascript/lib/malicacid/index.js"}
        ],
        "scripts": [
          "/resources/javascript/main.js"
        ]
      },
      "pages": [
        {
          "source": "pages/*.md",
          "target": "./*.html"
        },
        {
          "source": "pages/case-studies/*.md",
          "target": "./case-studies/*.html",
          "config": {
            "jinja_pass": true,
            "template": "case-study.html"
          }
        },
        {
          "source": "pages/errors/*.md",
          "target": "./*.shtml"
        },
        {
          "source": "pages/portfolio/*.md",
          "target": "./portfolio/*.html",
          "config": {
            "template": "portfolio-page.html"
          }
        }
      ],
      "templates": [
        "templates"
      ],
      "resources": [
        {
          "source": "resources/favicon.ico",
          "target": "./favicon.ico"
        },
        {
          "source": "resources/error/401.jpg",
          "target": "./401.jpg"
        },
        {
          "source": "resources/error/403.jpg",
          "target": "./403.jpg"
        },
        {
          "source": "resources/error/404.jpg",
          "target": "./404.jpg"
        },
        {
          "source": "resources/error/500.jpg",
          "target": "./500.jpg"
        },
        {
          "source": "resources/img",
          "target": "./resources/img"
        },
        {
          "source": "resources/javascript",
          "target": "./resources/javascript"
        },
        {
          "source": "resources/css/*.css",
          "target": "./resources/css/*.css"
        },
        {
          "source": "resources/css/base.less",
          "target": "./resources/css/base.css",
          "resource_type": "less"
        },
        {
          "source": "resources/css/snippets/gallery.less",
          "target": "./resources/css/gallery.css",
          "resource_type": "less"
        }
      ]
    }
  ]
}
